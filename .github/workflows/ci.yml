name: CI — Test Application Navette

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test (mode mock JSON)
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installation de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Installation des dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Génération du client Prisma (nécessaire pour les types TypeScript)
      - name: Generate Prisma client
        run: npx prisma generate

      # 5. Build Next.js en mode mock (pas de MySQL nécessaire)
      - name: Build application (mock DB)
        run: npm run build:test
        env:
          # Active le client JSON mock
          USE_MOCK_DB: "true"
          # Valeurs factices pour Next.js (non utilisées en mode mock)
          DATABASE_URL: "mysql://mock:mock@localhost:3306/mock_db"
          SMTP_HOST: "localhost"
          SMTP_PORT: "1025"
          SMTP_USER: "test@entreprise.com"
          SMTP_PASS: "test"
          SMTP_SECURE: "false"
          FROM_EMAIL: "test@entreprise.com"

      # 6. (Optionnel) Vérification de la configuration TypeScript
      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true
